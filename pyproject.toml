[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgarito"
version = "0.1.1"
description = "Retrieve, normalize, and reconcile company financial data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.11,<4",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
]
authors = [
    { name = "Jean-François Kener", email = "betterask.jf@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9,<1",
]

[project.scripts]
edgarito = "edgarito.cli.__main__:main"

[tool.setuptools.packages.find]
include = ["edgarito", "edgarito.*"]
exclude = ["venv_windows", "venv", "cache"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [
    "cache",
    "edgarito/enums/edgar/reference/all_filing_types.py",
]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
